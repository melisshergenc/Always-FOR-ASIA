<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>İstanbul Asya</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family: Georgia,"Times New Roman",serif; color:#f5e7c0;
  background:#070605 url("background.png") center center/cover no-repeat fixed;
}
body:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:0}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px max(6vh,28px)}
.brand{position:absolute;top:max(3vh,20px);left:0;right:0;text-align:center;letter-spacing:.28em;font-size:clamp(14px,2vw,22px);text-transform:uppercase;text-shadow:0 2px 12px #000}
.compass{position:relative;width:min(38vw,38vh,350px);aspect-ratio:1;border:1.5px solid rgba(224,161,75,.85);border-radius:50%;background:rgba(0,0,0,.42);box-shadow:0 0 35px rgba(217,145,53,.24),inset 0 0 35px rgba(0,0,0,.8);backdrop-filter:blur(2px)}
.ring{position:absolute;inset:8%;border:1px solid rgba(245,231,192,.45);border-radius:50%}
.cardinal{position:absolute;font-weight:700;font-size:clamp(13px,2vw,20px);text-shadow:0 2px 5px #000}
.n{top:3%;left:50%;transform:translateX(-50%)} .s{bottom:3%;left:50%;transform:translateX(-50%)} .w{left:4%;top:50%;transform:translateY(-50%)} .e{right:4%;top:50%;transform:translateY(-50%)}
.arrow{position:absolute;left:50%;top:50%;width:18%;height:60%;transform:translate(-50%,-50%) rotate(0deg);transform-origin:50% 50%;transition:transform .15s linear;filter:drop-shadow(0 4px 10px #000)}
.arrow:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:0;border-top:115px solid #f1dfb1}
.arrow:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-left:20px solid transparent;border-right:20px solid transparent;border-top:0;border-bottom:115px solid #e3a14b}
.dot{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background:#f4deb0;box-shadow:0 0 10px #d9923c}
.distance{margin-top:14px;font-size:clamp(30px,6vw,62px);line-height:1;text-shadow:0 3px 14px #000}
.label{margin-top:8px;font:600 clamp(10px,1.5vw,14px) Arial,sans-serif;letter-spacing:.32em;color:#dfa04d;text-transform:uppercase;text-shadow:0 2px 8px #000}
.status{margin-top:10px;min-height:20px;font:500 13px Arial,sans-serif;text-align:center;text-shadow:0 2px 8px #000;color:#f6e8c4}
button{margin-top:13px;border:1px solid #d99a48;border-radius:999px;padding:12px 22px;background:rgba(8,7,5,.75);color:#f5e7c0;font:600 13px Arial,sans-serif;letter-spacing:.12em;cursor:pointer}
button[hidden]{display:none}
@media(max-width:700px){
 body{background-position:center center}
 main{justify-content:flex-end;padding-bottom:max(7vh,36px)}
 .compass{width:min(76vw,330px)}
 .brand{top:22px}
}
</style>
</head>
<body>
<main>
  <div class="brand">ISTANBUL ASIA</div>
  <div class="compass">
    <div class="ring"></div><span class="cardinal n">N</span><span class="cardinal e">E</span><span class="cardinal s">S</span><span class="cardinal w">W</span>
    <div class="arrow" id="arrow"></div><div class="dot"></div>
  </div>
  <div class="distance" id="distance">— km</div>
  <div class="label">DISTANCE TO ISTANBUL ASIA</div>
  <div class="status" id="status">Konum bekleniyor…</div>
  <button id="start" hidden>PUSULAYI BAŞLAT</button>
</main>
<script>
// AIESEC Türkiye'nin güncel iletişim sayfasındaki İstanbul Asya ofisinin adresi:
// Osmanağa Mah., Söğütlüçeşme Cd. No:33, Kadıköy.
// Aşağıdaki koordinat bu adres için yaklaşık merkez noktadır.
// Kesin kapı pini istenirse TARGET_LAT/TARGET_LON değerlerini o pinle değiştirin.
const TARGET_LAT = 40.9909;
const TARGET_LON = 29.0289;

const arrow=document.getElementById("arrow"), distEl=document.getElementById("distance"),
statusEl=document.getElementById("status"), startBtn=document.getElementById("start");
let userLat=null,userLon=null,targetBearing=null,heading=null;

const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI, norm=x=>(x%360+360)%360;
function distanceKm(a,b,c,d){
 const R=6371, dLat=rad(c-a), dLon=rad(d-b);
 const h=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b,c,d){
 const p1=rad(a),p2=rad(c),dl=rad(d-b);
 return norm(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))));
}
function render(){
 if(targetBearing==null)return;
 // target bearing is relative to true/geographic north; subtract phone heading
 // so the arrow points to the target on the physical screen.
 const rotation=heading==null?targetBearing:norm(targetBearing-heading);
 arrow.style.transform=`translate(-50%,-50%) rotate(${rotation}deg)`;
}
function gotPos(p){
 userLat=p.coords.latitude; userLon=p.coords.longitude;
 const km=distanceKm(userLat,userLon,TARGET_LAT,TARGET_LON);
 targetBearing=bearing(userLat,userLon,TARGET_LAT,TARGET_LON);
 distEl.textContent=km<10?km.toFixed(2)+" km":km.toFixed(1)+" km";
 statusEl.textContent=heading==null?"Konum bulundu. Telefon pusulası bekleniyor…":"İstanbul Asya yönü";
 render();
}
function posErr(e){statusEl.textContent="Konum izni gerekli: "+e.message}
function onOrientation(e){
 let h=null;
 if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading; // iPhone Safari
 else if(e.absolute===true && typeof e.alpha==="number") h=norm(360-e.alpha); // many Android browsers
 else if(typeof e.alpha==="number") h=norm(360-e.alpha);
 if(h!=null){heading=h;statusEl.textContent=userLat==null?"Konum bekleniyor…":"İstanbul Asya yönü";render()}
}
async function startCompass(){
 try{
  if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
   const r=await DeviceOrientationEvent.requestPermission();
   if(r!=="granted"){statusEl.textContent="Pusula sensörü izni verilmedi.";return}
  }
  window.addEventListener("deviceorientationabsolute",onOrientation,true);
  window.addEventListener("deviceorientation",onOrientation,true);
  startBtn.hidden=true;
 }catch(err){statusEl.textContent="Pusula başlatılamadı: "+err.message}
}
if(navigator.geolocation){
 navigator.geolocation.watchPosition(gotPos,posErr,{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}else statusEl.textContent="Bu cihaz konum özelliğini desteklemiyor.";

startBtn.addEventListener("click", async () => {
 statusEl.textContent="Pusula başlatılıyor…";
 await startCompass();
});

if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
 startBtn.hidden=false;
 statusEl.textContent="Konuma izin ver, sonra pusulayı başlat.";
}else{
 startCompass();
}
</script>
</body>
</html>
