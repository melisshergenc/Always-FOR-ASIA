<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#080808" />
<title>Always for Asia</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#f4e7c4;font-family:Georgia,'Times New Roman',serif}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.58)),url('background.png') center/cover no-repeat;transform:scale(1.02);z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at center,transparent 0 30%,rgba(0,0,0,.28) 70%,rgba(0,0,0,.65) 100%);z-index:-1}
main{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.panel{display:flex;flex-direction:column;align-items:center;gap:18px;text-shadow:0 2px 14px #000}
.compass{width:min(72vw,360px);aspect-ratio:1;border:1px solid rgba(231,176,99,.75);border-radius:50%;position:relative;box-shadow:0 0 0 6px rgba(231,176,99,.08),0 0 55px rgba(230,156,66,.22),inset 0 0 35px rgba(0,0,0,.65);backdrop-filter:blur(2px);background:rgba(0,0,0,.16)}
.ring{position:absolute;inset:9%;border:1px solid rgba(245,224,180,.45);border-radius:50%}
.tick{position:absolute;left:50%;top:3%;width:1px;height:10px;background:#d7aa68;transform-origin:50% calc(50% + 169px)}
.cardinal{position:absolute;font-size:14px;letter-spacing:.12em;color:#f1dfb9}.n{top:5%;left:50%;transform:translateX(-50%)}.s{bottom:5%;left:50%;transform:translateX(-50%)}.e{right:6%;top:50%;transform:translateY(-50%)}.w{left:6%;top:50%;transform:translateY(-50%)}
.arrowWrap{position:absolute;inset:18%;display:flex;align-items:center;justify-content:center;transition:transform .18s linear;filter:drop-shadow(0 5px 9px rgba(0,0,0,.7))}
.arrow{width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-bottom:105px solid #e1a052;position:relative;transform:translateY(-32px)}
.arrow::after{content:"";position:absolute;left:-19px;top:105px;border-left:19px solid transparent;border-right:19px solid transparent;border-top:68px solid rgba(245,230,194,.88)}
.center{position:absolute;width:15px;height:15px;border-radius:50%;background:#f2d7a4;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px #df9a47}
.distance{font-size:clamp(28px,7vw,46px);letter-spacing:.04em}.caption{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#d39a55}.status{max-width:330px;font:13px/1.5 Arial,sans-serif;color:rgba(255,244,218,.82)}
button{border:1px solid #c98b45;background:rgba(8,8,8,.62);color:#f1dfb9;border-radius:999px;padding:12px 20px;font:600 12px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.3)}
button:active{transform:scale(.98)}
@media(min-width:800px){.compass{width:330px}.panel{gap:15px}}
</style>
</head>
<body>
<main><section class="panel">
<div class="compass" aria-label="Hedef pusulası"><div class="ring"></div><span class="cardinal n">N</span><span class="cardinal e">E</span><span class="cardinal s">S</span><span class="cardinal w">W</span><div class="arrowWrap" id="arrow"><div class="arrow"></div></div><div class="center"></div></div>
<div class="distance" id="distance">—</div><div class="caption">distance to destination</div>
<button id="start">Pusulayı Başlat</button><div class="status" id="status">Konum ve hareket sensörü izni gerekir. En iyi sonuç için telefondan aç.</div>
</section></main>
<script>
// 0°59'27.9"K 29°01'33.9"D -> decimal degrees
const TARGET={lat:0+59/60+27.9/3600, lon:29+1/60+33.9/3600};
const $=id=>document.getElementById(id); let pos=null,bearing=null,heading=0;
function rad(x){return x*Math.PI/180} function deg(x){return x*180/Math.PI}
function distanceKm(a,b){const R=6371;const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearingTo(a,b){const p1=rad(a.lat),p2=rad(b.lat),dl=rad(b.lon-a.lon);const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (deg(Math.atan2(y,x))+360)%360}
function render(){if(!pos)return; const km=distanceKm(pos,TARGET); bearing=bearingTo(pos,TARGET); $('distance').textContent=km<1?`${Math.round(km*1000)} m`:`${km.toFixed(km<10?2:1)} km`; $('arrow').style.transform=`rotate(${bearing-heading}deg)`}
function onOrientation(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.alpha!=null)h=(360-e.alpha)%360;if(h!=null){heading=h;render()}}
function watchLocation(){if(!navigator.geolocation){$('status').textContent='Bu tarayıcı konum özelliğini desteklemiyor.';return}navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};$('status').textContent='Hedef yönü ve kuş uçuşu mesafe canlı olarak güncelleniyor.';render()},err=>{$('status').textContent='Konum alınamadı: '+err.message},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
async function start(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw new Error('Hareket sensörü izni verilmedi.')}window.addEventListener('deviceorientationabsolute',onOrientation,true);window.addEventListener('deviceorientation',onOrientation,true);watchLocation();$('start').style.display='none'}catch(e){$('status').textContent=e.message}}
$('start').addEventListener('click',start);
</script>
</body></html>
